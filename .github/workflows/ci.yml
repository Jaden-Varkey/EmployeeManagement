name: CI

on:
  push:
    branches: [main, virtual-scroll]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Fails if any file isn't formatted to .NET conventions (dotnet format).
      - name: Format check
        run: dotnet format --verify-no-changes
